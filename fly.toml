# Fly.io configuration for GojoXNG
# Privacy-respecting metasearch engine based on SearXNG
#
# How to deploy:
# 1. Install flyctl: https://fly.io/docs/hands-on/install-flyctl/
# 2. fly auth login
# 3. fly launch --no-deploy
# 4. fly secrets set SEARXNG_SECRET=$(openssl rand -hex 32)
# 5. fly deploy
# 6. fly open

app = "gojoxng"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 0

[http_service.concurrency]
  type = "requests"
  hard_limit = 250
  soft_limit = 200

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[env]
  SEARXNG_BIND_ADDRESS = "0.0.0.0"
  SEARXNG_PORT = "8080"
  SEARXNG_IMAGE_PROXY = "true"
  SEARXNG_METHOD = "POST"
  PYTHONUNBUFFERED = "1"

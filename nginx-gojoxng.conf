# Nginx reverse proxy configuration for GojoXNG
# Use this to deploy GojoXNG behind nginx with HTTPS
#
# Install: sudo cp nginx-gojoxng.conf /etc/nginx/sites-available/gojoxng
# Enable:  sudo ln -s /etc/nginx/sites-available/gojoxng /etc/nginx/sites-enabled/
# SSL:     sudo certbot --nginx -d gojoxng.example.com

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=gojoxng_limit:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name gojoxng.example.com;

    # Redirect HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gojoxng.example.com;

    # SSL certificates (managed by certbot)
    ssl_certificate /etc/letsencrypt/live/gojoxng.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gojoxng.example.com/privkey.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag noindex, nofollow always;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;

    # GojoXNG backend (Docker container on port 8080)
    location / {
        limit_req zone=gojoxng_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Disable buffering for real-time results
        proxy_buffering off;
        proxy_request_buffering off;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
    }

    # Static files caching
    location ~* \.(png|jpg|jpeg|gif|svg|ico|css|js|woff2?)$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# GojoXNG settings - deployed instance configuration
# This file is mounted into the container at /etc/searxng/settings.yml
# It extends the default SearXNG settings built into the image.

use_default_settings: true

general:
  instance_name: "GojoXNG"
  debug: false
  privacypolicy_url: false
  donation_url: false
  contact_url: false
  enable_metrics: false
  open_metrics: ''

server:
  secret_key: "REPLACE_WITH_GOJOXNG_SECRET_ENV"
  image_proxy: true
  http_protocol_version: "1.1"
  method: "POST"
  public_instance: false
  limiter: false
  default_http_headers:
    X-Content-Type-Options: nosniff
    X-Download-Options: noopen
    X-Robots-Tag: noindex, nofollow
    Referrer-Policy: no-referrer
    X-XSS-Protection: "1; mode=block"
    X-Frame-Options: SAMEORIGIN
    Permissions-Policy: "geolocation=(), camera=(), microphone=()"

ui:
  static_path: ""
  templates_path: ""
  query_in_title: false
  default_theme: simple
  center_alignment: false
  default_locale: ""
  theme_args:
    simple_style: auto
  search_on_category_select: true
  hotkeys: default
  url_formatting: pretty

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "auto"

outgoing:
  request_timeout: 3.0
  useragent_suffix: ""
  pool_connections: 100
